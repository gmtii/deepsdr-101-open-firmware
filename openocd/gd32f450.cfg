# Config OpenOCD para GD32F450VET6 (LQFP100, 512KB flash, banco unico)
#
# Motivo de este fichero: el ID de silicio que reporta el GD32F450
# (0x419 en los bits bajos de DBGMCU_IDCODE) coincide con el usado por
# STM32F42x/43x en la tabla de deteccion de target/stm32f4x.cfg, que
# asume flash de 2048KB en DOBLE banco. La VET6 real tiene 512KB en un
# UNICO banco, así que dejamos que se detecte el target normalmente
# pero forzamos el tamaño real de flash en el "flash bank" en vez de
# dejarlo en autoprobe (0).

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME gd32f450
}

set _ENDIAN little

if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x8000
}

if { [info exists CPUTAPID] } {
   set _CPUTAPID $CPUTAPID
} else {
   if { [using_jtag] } {
      set _CPUTAPID 0x4ba00477
   } {
      set _CPUTAPID 0x2ba01477
   }
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

if {[using_jtag]} {
   jtag newtap $_CHIPNAME bs -irlen 5
}

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# --- AQUI la diferencia clave frente al stm32f4x.cfg de serie ---
# Tamaño de flash forzado a 512KB (0x80000), banco unico, en vez de
# dejar que el driver "adivine" mal 2048KB dual-bank.
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME stm32f2x 0x08000000 0x80000 0 0 $_TARGETNAME

adapter speed 2000
adapter srst delay 100
if {[using_jtag]} {
 jtag_ntrst_delay 100
}

# No hay pin NRST fisico cableado entre el ST-Link y la placa. No
# configuramos reset_config para requerir SRST: dejamos que OpenOCD use
# su mecanismo por defecto para hla_swd, que via "reset halt"/"reset
# run" resetea el core mediante el propio enlace SWD sin necesitar la
# linea fisica de reset.

$_TARGETNAME configure -event examine-end {
	mmw 0xE0042004 0x00000007 0
	mmw 0xE0042008 0x00001800 0
}

$_TARGETNAME configure -event reset-init {
	adapter speed 8000
}

$_TARGETNAME configure -event reset-start {
	adapter speed 2000
}
